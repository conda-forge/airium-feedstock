{% set name = "airium" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/airium-{{ version }}.tar.gz
  sha256: 9052f50d4b24b3e06db09b7edfa7cc61cc6f91e702c903f0a640fc5fd1ff1574

build:
  entry_points:
    - airium = airium.__main__:entry_main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - airium
  commands:
    - pip check
    - airium --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.com/kamichal/airium
  summary: Easy and quick html builder with natural syntax correspondence (python->html). No templates needed. Serves pure pythonic library with no dependencies.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmacdope
    - mikemhenry
