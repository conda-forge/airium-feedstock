{% set name = "airium" %}
{% set version = "0.2.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/airium-{{ version }}.tar.gz
  sha256: 6b4dd8b69838b7766179ab90078a049dc337b1da4fc0f7754f30f74d6eed706e

build:
  entry_points:
    - airium = airium.__main__:entry_main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - airium
  commands:
    - pip check
    - airium --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.com/kamichal/airium
  summary: Easy and quick html builder with natural syntax correspondence (python->html). No templates needed. Serves pure pythonic library with no dependencies.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmacdope
    - mikemhenry
